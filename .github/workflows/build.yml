name: Build HyperDeX

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || gradle wrapper

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Package Module ZIP
        run: |
          mkdir -p module/app
          cp app/build/outputs/apk/release/app-release-unsigned.apk module/app/HyperDeX.apk || cp app/build/outputs/apk/release/*.apk module/app/HyperDeX.apk
          python3 tools/build_module.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HyperDeX-Release
          path: |
            module/app/HyperDeX.apk
            release/HyperDeX_v1.0.0.zip
            release/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module/app/HyperDeX.apk
            release/HyperDeX_v1.0.0.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
